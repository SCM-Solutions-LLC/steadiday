# .github/workflows/update-sitemap-and-index.yml
#
# Automatically regenerates sitemap.xml and notifies search engines
# whenever the site is updated (new blog posts, page changes, etc.)
#
# Triggers:
#   - After any push to main that changes HTML files, including merging a
#     blog draft pull request
#   - Manual trigger
#
# The blog generator no longer pushes to main; it opens a pull request.
# Running when the generator finishes would only re-ping search engines
# for a post that isn't live yet, so there is no workflow_run trigger.
name: Update Sitemap & Index
on:
  # Trigger on direct HTML changes pushed to main
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'blog/*.html'
  
  # Manual trigger
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
# Prevent concurrent runs
concurrency:
  group: sitemap-update
  cancel-in-progress: false
jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log dates
      
      # ── Step 1: Regenerate sitemap.xml ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Generate sitemap
        run: python scripts/generate_sitemap.py
      
      - name: Commit updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add sitemap.xml
          
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No sitemap changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-update sitemap.xml [skip ci]"
          for i in 1 2 3; do
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              git rebase --abort
              echo "::error::Rebase onto $GITHUB_REF_NAME conflicted; re-run this workflow to regenerate the sitemap on the latest $GITHUB_REF_NAME."
              exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Sitemap committed and pushed on attempt $i."
              exit 0
            fi
            echo "Push failed on attempt $i, retrying..."
            sleep 5
          done
          echo "::error::Sitemap push failed after 3 attempts."
          exit 1
      
      # ── Step 2: Submit sitemap to Google Search Console ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Node dependencies
        run: |
          cd scripts
          npm init -y > /dev/null 2>&1
          npm install googleapis google-auth-library
      
      - name: Submit sitemap to Google
        env:
          GOOGLE_SEARCH_CONSOLE_JSON_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_JSON_KEY }}
        run: node scripts/submit_to_google.js
      
      # ── Step 3: Submit to IndexNow (Bing, DuckDuckGo, Yandex) ──
      - name: Submit to IndexNow
        env:
          INDEX_NOW_API_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/submit_to_indexnow.py --days 2
